name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt ruff
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Lint
        run: ruff check .

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build onedir package
        run: python -m PyInstaller --noconfirm --clean FileOrganizer.spec
      - name: Create distributable zip
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          Compress-Archive -Path "dist/FileOrganizer/*" -DestinationPath "dist/FileOrganizer-$version.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-windows
          path: dist/FileOrganizer-*.zip
          if-no-files-found: error
